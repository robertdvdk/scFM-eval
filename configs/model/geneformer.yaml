# @package _global_

model:
  name: geneformer
  pretrained_path: ctheodoris/Geneformer  # HuggingFace Hub ID or local dir
  token_dictionary_path: null              # null = use geneformer bundled default
  median_dictionary_path: null             # null = use geneformer bundled default
  gene_name_id_dict_path: null             # null = use geneformer bundled default (symbol -> Ensembl)
  gene_col: "index"                        # Column in adata.var with gene names; "index" = var_names
  max_input_size: 4096                     # V2 context window (V1 was 2048)
  model_version: "V2"
  embedding_strategy: cls                  # cls or mean_pool
  layer_to_quant: -1                       # Transformer layer for embeddings (-1 = penultimate)
  batch_size: 32
  env_path: null                           # Path to isolated venv (null = in-process)
  subprocess_timeout: 3600                 # Max seconds for subprocess
