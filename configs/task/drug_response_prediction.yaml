# @package _global_

task:
  name: drug_response_prediction

  model_name: CancerGPT
  run_group: ${task.split_mode}

  foundation_models: []
  run_baselines: false

  data:
    data_root: data/drug_response_prediction/
    drug_emb_path: ground_truth/drug_embeddings_molformer.csv
    dose_response_path: ground_truth/dose_response_matrix.csv
    metadata: ground_truth/dose_response_subset.csv
    ground_truth_h5ad: ground_truth/expr.h5ad
    submission: [submission/scFoundation_full_expr.csv,submission/scFoundation_max_expr.csv]

  # ==========================================
  # EVALUATION STRATEGY
  # ==========================================
  # Modes:
  #   1. 'random'          (Transductive: Random shuffle)
  #   2. 'cold_drug'       (Inductive Chemistry: Unseen Drugs)
  #   3. 'cold_cell'       (Inductive Biology: Unseen Cells)
  #   4. 'cancer_stratified' (Cold cell split stratified by cancer type)
  #   5. 'double_cold'     (Zero-Shot: Unseen Drug x Unseen Cell)
  #   6. 'loto'            (OOD: Leave-One-Tissue-Out)
  split_mode: "cold_cell"

  # ==========================================
  # ROBUSTNESS (K-Fold Cross Validation)
  # ==========================================
  # If k_fold > 1, the code runs K-Fold CV.
  # This AUTOMATICALLY handles splitting and overrides 'test_drug'/'drug_proportion'.
  # Supported for: 'cold_drug', 'cold_cell', 'double_cold'.
  # Ignored for: 'loto' (uses biology), 'random'.
  k_fold: 10 # Set to 0 or 1 to disable

  # ==========================================
  # SINGLE SPLIT ARGUMENTS (Used if k_fold <= 1)
  # ==========================================

  # For 'cold_drug' mode:
  test_drug: null         # Optional: Specific Drug ID (e.g. "1003") to hold out
  val_drug: null          # Optional: Specific Drug ID to use for validation
  drug_proportion: null   # Optional: Float (e.g. 0.1) to hold out 10% random drugs

  # For 'loto' mode:
  test_tissue: null       # Required: TCGA Label (e.g. "LUAD", "BRCA", "LAML")

  # ==========================================
  # HVG+PCA BASELINE
  # ==========================================
  hvg_pca_baseline:
    n_hvgs: 1200   # Number of highly variable genes
    n_pcs: 256     # PCA components (match FM embedding dim)

  # Raw expression baseline: train MLP on all genes, no HVG/PCA
  run_raw_expression_baseline: false

  # ==========================================
  # TRAINING HYPERPARAMETERS
  # ==========================================
  batch_size: 256
  learning_rate: 0.003
  epochs: 500
  patience: 10

  # System
  gpu_id: 0
  num_workers: 4
  data_seed: 42
  model_seed: 42
  fully_deterministic: False

  # Outputs
  save_predictions: true
